# ============================================================
# ONEE SWEEPER v3.0 — 雙執行檔架構
#
# 工作區包含兩個獨立執行檔：
#   - daemon/   後台服務（常駐系統托盤，檔案監控、掃描、清理）
#   - ui/       UI 設定工具（開啟設定 → 關閉，不佔用系統資源）
# ============================================================
[workspace]
members = ["daemon", "ui"]
resolver = "2"

[workspace.package]
version = "3.0.0"
edition = "2021"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
